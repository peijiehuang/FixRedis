name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Check version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match Directory.Build.props: v$version"
          }
      - name: Build
        run: dotnet build FixRedis.sln -c Release
      - name: Run unit tests (no installed Redis required)
        run: dotnet run --project tests/FixRedis.Tests -c Release --no-build -- --filter '[单元]'
      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "artifacts/release/FixRedis-$env:GITHUB_REF_NAME-win-x64.exe" "artifacts/release/FixRedis-Recovery-Guide.md" --title "FixRedis $($env:GITHUB_REF_NAME.ToUpperInvariant())" --notes-file CHANGELOG.md --verify-tag
